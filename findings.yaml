# MP076 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G078"          # your group id, e.g. "G042"
problem_id: "MP076"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: avg_ticket_rs  # the column recorded in a different unit
    group_value: Market    # the value of area whose rows are affected
    factor: 0.001          # wrong value = right value x factor
  sentinel_value:
    present: true
    column: nearby_shops
    value: -999            # the special number typed instead of a blank
    count: 45              # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 9               # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "MP076_ATM_Cash_Demand"
  best_run_id: "ecd890a3cd0c4295a11741cf8f3eac64"        # the MLflow run id of your v1 model
  registered_model_name: "mp076_atm_demand"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    nearby_shops: null
    days_to_salary: null
    footfall_index: null
    distance_to_market_km: null
    avg_ticket_rs: null
    other_atms_1km: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of area
    'Market': null
    'Residential': null
    'Highway': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
