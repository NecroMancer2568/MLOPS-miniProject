stages:
  clean:
    cmd: python -m scripts.dataset_cleaning.clean_and_preprocess --input-dir data --output-dir data/processed --imputation-strategy ${cleaning.imputation_strategy}
    deps:
      - scripts/dataset_cleaning/clean_and_preprocess.py
      - data/train.csv
      - data/later.csv
      - data/holdout_features.csv
    params:
      - cleaning.imputation_strategy
    outs:
      - data/processed/train_clean.csv
      - data/processed/later_clean.csv
      - data/processed/holdout_clean.csv
      - data/processed/cleaning_summary.json:
          cache: false

  train:
    cmd: python -m src.train --params params.yaml
    deps:
      - src/features.py
      - src/train.py
      - data/processed/train_clean.csv
      - data/processed/later_clean.csv
    params:
      - training.random_state
      - training.cv_splits
      - training.later_adaptation_weight
      - training.clip_non_negative
    outs:
      - artifacts/best_model.joblib
    metrics:
      - artifacts/metrics.json:
          cache: false

  predict:
    cmd: python -m src.predict --params params.yaml
    deps:
      - src/features.py
      - src/predict.py
      - data/processed/holdout_clean.csv
      - artifacts/best_model.joblib
    outs:
      - predictions/holdout_predictions.csv:
          cache: false

  monitor:
    cmd: python -m monitoring.drift_monitor --params params.yaml
    deps:
      - monitoring/drift_monitor.py
      - data/processed/train_clean.csv
      - data/processed/later_clean.csv
      - data/processed/holdout_clean.csv
      - artifacts/best_model.joblib
    params:
      - monitoring.psi_bins
      - monitoring.psi_warn_threshold
      - monitoring.psi_alert_threshold
      - monitoring.ks_alpha
    metrics:
      - monitoring/reports/drift_report.json:
          cache: false
