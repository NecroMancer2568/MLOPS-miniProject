name: MP076 MLOps CI

on:
  push:
    branches: ["manas"]
  pull_request:
    branches: ["manas"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q scripts src monitoring app tests

      - name: Validate YAML
        run: |
          python -c "import yaml; files=['params.yaml','findings.yaml','dvc.yaml','k8s/deployment.yaml','k8s/service.yaml']; [yaml.safe_load(open(f,encoding='utf-8')) for f in files]; print('All YAML files valid')"

      - name: Run tests
        run: python -m pytest -v
