apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp076-api
  labels:
    app: mp076-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp076-api
  template:
    metadata:
      labels:
        app: mp076-api
    spec:
      containers:
        - name: mp076-api
          image: mp076-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
