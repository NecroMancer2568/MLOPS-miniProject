apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp076-api
  labels:
    app: mp076-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp076-api
  template:
    metadata:
      labels:
        app: mp076-api
    spec:
      containers:
        - name: mp076-api
          image: mp076-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MP076_MODEL_PATH
              value: artifacts/best_model.joblib
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
